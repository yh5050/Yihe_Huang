0 26px;font-size:14px;font-weight:700;line-height:17.5px}.na-h{margin:26px 0 12px;font-family:"Bodoni Moda",serif;font-size:22px;font-weight:400;line-height:1.2}.na-q{margin:0 0 14px;padding-left:14px;border-left:2px solid rgba(255,255,255,.35);font-size:14px;font-style:italic;line-height:20px;color:rgba(255,255,255,.82)}.na-p{margin:0 0 14px;font-size:14px;font-weight:500;line-height:20px;color:rgba(255,255,255,.92)}@media (prefers-reduced-motion: reduce){.na-ov-in,.na-host:hover .na-ov-in{transition:opacity .2s;transform:none;clip-path:none}}

<body>
<div id="app"></div>
<template id="dc-tpl">
<div id="fold-root" class="fold-root" tabindex="0" aria-label="Yihe Huang’s work in five chapters: UX Research, Art, Media, Publication, and About. Scroll, swipe, or use the arrow keys to move through time." style="position: relative; width: 100%; height: 100vh; min-height: 560px; overflow: hidden; background: #1e0630; color: #fff3e6; font-family: 'Inter', system-ui, sans-serif; touch-action: none; user-select: none">

<sc-if value="{{noGL}}" hint-placeholder-val="{{ false }}">
<img src="assets/lib-fold-reference.jpg" alt="Orange and violet light streams spiralling out of a bright core inside a fractured, glitching room" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
</sc-if>
<canvas id="fold-gl" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block"></canvas>

<div class="fc-line" aria-hidden="true" style="position: absolute; left: 50%; top: 0; bottom: 0; width: 0; border-left: 1px dotted rgba(246, 232, 220, 0.42)"></div>

<div class="fc-view {{viewCls}}" style="position: absolute; inset: 0; overflow: hidden; pointer-events: none">
<div id="fc-track" style="position: absolute; left: 0; right: 0; top: 0; height: 0; will-change: transform">
<sc-for list="{{entries}}" as="e" hint-placeholder-count="6">
<div class="fc-item fc-{{e.side}} {{e.dim}} {{e.extra}}" style="top: {{e.top}}; width: {{e.width}}; pointer-events: auto">

<sc-if value="{{e.isHero}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 18px; padding: 24px">
<h1 class="fc-hero-name" style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 120px; line-height: 0.92; color: #fff3e6; text-shadow: 0 0 40px rgba(255, 150, 70, 0.4)">Yihe Huang</h1>
<p style="margin: 0; max-width: 560px; font-size: 16px; line-height: 1.55; color: rgba(246, 232, 220, 0.9)">UX Researcher &amp; Multidisciplinary Designer in New York. Research-led design for innovative products and human-centered experiences.</p>
<span style="margin-top: 18px; font-family: 'Instrument Serif', serif; font-style: italic; font-size: 26px; color: #fff3e6">Scroll to move through time.</span>
</div>
</sc-if>

<sc-if value="{{e.isChapter}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding: 30px 32px; background: rgba(26, 10, 42, 0.72); border: 0; border-radius: 10px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(10px)">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.26em; text-transform: uppercase; color: {{e.color}}">{{e.kicker}}</span>
<h2 class="fc-chapter-title" style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 68px; line-height: 0.95; color: #fff3e6">{{e.title}}</h2>
<p style="margin: 0; max-width: 460px; font-size: 14px; line-height: 1.6; color: #f7efe6">{{e.body}}</p>
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(246, 232, 220, 0.7)">{{e.meta}}</span>
</div>
</sc-if>

<sc-if value="{{e.isAbout}}" hint-placeholder-val="{{ false }}">
<div class="fc-card fc-about" style="position: relative; background: rgba(22, 8, 36, 0.95); border: 0; border-radius: 10px; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 18px 50px rgba(10, 0, 20, 0.5); overflow: hidden">
<div class="fc-about-scroll" style="max-height: min(calc(100vh - 210px), 800px); overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; user-select: text">
<div class="fc-about-grid" style="display: grid; grid-template-columns: 290px 1fr; align-items: start">

<aside class="fc-about-side" style="box-sizing: border-box; padding: 26px 24px 26px; background: rgba(52, 20, 78, 0.6); border-right: 1px solid rgba(255, 214, 170, 0.18); display: flex; flex-direction: column; gap: 16px; align-self: stretch">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.26em; text-transform: uppercase; color: #f6e3c4">Chapter V · Profile</span>
<img src="assets/na-profile.jpg" alt="Portrait of Yihe Huang: long dark hair, black sleeveless top and a gold coin necklace, against a deep blue backdrop" style="display: block; width: 100%; height: auto; aspect-ratio: 1087 / 1446; object-fit: cover; border-radius: 8px; border: 0; box-shadow: 0 0 36px rgba(255, 150, 90, 0.18)">
<h2 style="margin: 4px 0 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 46px; line-height: 0.95; color: #fff3e6">Yihe Huang</h2>
<div style="display: flex; flex-direction: column; gap: 4px; font-family: 'Space Mono', monospace; font-size: 11px; line-height: 1.6; letter-spacing: 0.04em; color: rgba(246, 232, 220, 0.82)">
<span>UX Designer · Data Analyst</span>
<span>Creative Technologist</span>
<span style="color: #ffc27a">New York · China · United States</span>
</div>
</aside>

<div style="box-sizing: border-box; padding: 26px 30px 28px; display: flex; flex-direction: column; gap: 24px; min-width: 0">

<section style="display: flex; flex-direction: column; gap: 10px">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: #ffc27a">01 · About</span>
<h3 style="margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 34px; line-height: 1.05; color: #fff3e6">Nice to meet you, I’m Yihe Huang.</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.7; color: #f7efe6">I am a UX Designer, Data Analyst, and Creative Technologist working at the intersection of design, data science, and technology.</p>
<p style="margin: 0; font-size: 14px; line-height: 1.7; color: rgba(247, 239, 230, 0.86)">Based in New York, I bring a cross-cultural perspective shaped by experiences across China and the United States. My work combines creative thinking, human-centered design, and data-driven problem solving to create intuitive experiences and impactful products.</p>
</section>

<div class="fc-about-pair" style="display: grid; grid-template-columns: 1fr 1fr; gap: 26px; padding-top: 20px; border-top: 1px dotted rgba(246, 232, 220, 0.32); align-items: start"><section style="display: flex; flex-direction: column; gap: 10px; min-width: 0">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: #ffc27a">02 · Education</span>
<div style="display: grid; grid-template-columns: 1fr; gap: 10px">
<div style="padding: 12px 14px; border: 1px solid rgba(255, 214, 170, 0.22); border-radius: 8px; background: rgba(255, 190, 120, 0.05)"><p style="margin: 0 0 4px; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 17px; text-transform: uppercase; color: #fff3e6">New York University</p><p style="margin: 0; font-size: 13px; line-height: 1.55; color: rgba(247, 239, 230, 0.86)">Graduate studies in Human-Computer Interaction and Data Science</p></div>
<div style="padding: 12px 14px; border: 1px solid rgba(255, 214, 170, 0.22); border-radius: 8px; background: rgba(255, 190, 120, 0.05)"><p style="margin: 0 0 4px; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 17px; text-transform: uppercase; color: #fff3e6">School of Visual Arts</p><p style="margin: 0; font-size: 13px; line-height: 1.55; color: rgba(247, 239, 230, 0.86)">Bachelor of Fine Arts</p></div>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 10px; min-width: 0">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: #ffc27a">03 · Practice</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span class="fc-chip">UX design</span><span class="fc-chip">User research</span><span class="fc-chip">Data analytics</span><span class="fc-chip">Creative technology</span><span class="fc-chip">Product development</span><span class="fc-chip">Mixed-methods research</span><span class="fc-chip">Service &amp; systems thinking</span><span class="fc-chip">Insight storytelling</span>
</div>
</section>
</div>

<div class="fc-about-pair" style="display: grid; grid-template-columns: 1fr 1fr; gap: 26px; padding-top: 20px; border-top: 1px dotted rgba(246, 232, 220, 0.32); align-items: start"><section style="display: flex; flex-direction: column; gap: 10px; min-width: 0">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: #ffc27a">04 · Research approach</span>
<p style="margin: 0; font-size: 14px; line-height: 1.6; color: rgba(247, 239, 230, 0.86)">A practical process for turning uncertainty into direction, for teams that need crisp decisions, credible evidence, and artifacts that move product conversations forward.</p>
<div class="fc-about-4col" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
<div class="fc-step"><span>01</span><b>Frame</b><p>Clarify goals, research questions, participants, and decision risks.</p></div>
<div class="fc-step"><span>02</span><b>Study</b><p>Interviews, usability tests, diary studies, surveys, desk research.</p></div>
<div class="fc-step"><span>03</span><b>Synthesize</b><p>Turn mixed evidence into patterns, tensions, and opportunities.</p></div>
<div class="fc-step"><span>04</span><b>Shape</b><p>Principles, concepts, prototypes, roadmaps, accessible outcomes.</p></div>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 12px; padding: 20px; border: 1px solid rgba(255, 214, 170, 0.4); border-radius: 10px; background: linear-gradient(135deg, rgba(255, 190, 120, 0.12), rgba(195, 162, 255, 0.08))">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: #ffc27a">05 · Contact</span>
<h3 style="margin: 0; font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; font-size: 34px; line-height: 1; color: #fff3e6">Let’s talk.</h3>
<p style="margin: 0; font-size: 14px; line-height: 1.65; color: #f7efe6">Open to UX research roles, product strategy conversations, collaboration across AI and emerging technology, and projects where research can make complex decisions clearer.</p>
<div class="fc-about-3col" style="display: grid; grid-template-columns: 1fr; gap: 8px"><div class="fc-contact-mail"><a class="fc-contact" href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=yh5050@nyu.edu&amp;su=Hello%20Yihe" target="_blank" rel="noopener" aria-label="Write an email to Yihe Huang at yh5050@nyu.edu"><span class="fc-contact-k">Email</span><span class="fc-contact-v">yh5050@nyu.edu ↗</span></a></div><a class="fc-contact" href="https://www.linkedin.com/in/huang-yihe/" target="_blank" rel="noopener"><span class="fc-contact-k">LinkedIn</span><span class="fc-contact-v">huang-yihe ↗</span></a><a class="fc-contact" href="https://github.com/yh5050" target="_blank" rel="noopener"><span class="fc-contact-k">GitHub</span><span class="fc-contact-v">yh5050 ↗</span></a></div>
</section>
</div>

</div>
</div>
</div>
</div>
</sc-if>
<sc-if value="{{e.isWork}}" hint-placeholder-val="{{ true }}">
<div class="fc-card" style="display: flex; align-items: stretch; gap: 0; background: rgba(26, 10, 42, 0.82); border: 0; border-radius: 10px; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 18px 50px rgba(10, 0, 20, 0.5); overflow: hidden">
<div class="fc-profile" style="width: 190px; flex-shrink: 0; box-sizing: border-box; padding: 18px 18px 20px; background: rgba(52, 20, 78, 0.6); border-right: 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 14px">
<span style="width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; background: {{e.color}}; box-shadow: 0 0 22px {{e.color}}"></span>
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 18px; line-height: 1.05; text-transform: uppercase; color: #fff3e6">{{e.title}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.04em; color: rgba(246, 232, 220, 0.8)">
<span>{{e.kicker}}</span>
<span style="color: {{e.color}}">{{e.meta}}</span>
</div>
</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; padding: 18px 18px 16px">

<div style="display: flex; flex-wrap: wrap; gap: 30px 32px; margin-top: 70px">
<div style="flex: 526 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 10px"><h2 class="ssm-h2" style="margin: 0; font-size: 38px; font-weight: 600; line-height: 41px; letter-spacing: -1.33px; color: #000000">Overview</h2><p style="margin: 0; font-size: 14px; font-weight: 500; line-height: 19px; letter-spacing: -0.07px; color: #666666; text-align: justify">Time Map is a spatial communication platform that lets people create memory capsules tied to a specific place and point in time. By combining an interactive map with a draggable timeline, users can intentionally rediscover past experiences or access messages scheduled for the future.</p><p style="margin: 0; font-size: 14px; font-weight: 500; line-height: 19px; letter-spacing: -0.07px; color: #666666; color: #000000">Product vision:</p><p style="margin: 0; font-size: 14px; font-weight: 500; line-height: 19px; letter-spacing: -0.07px; color: #666666">What if memories could be discovered instead of just stored?</p></div>
<div style="flex: 500 1 320px; min-width: 0; padding: 22px; border-radius: 24px; background: #f1f2f6; display: flex; flex-direction: column; gap: 10px"><p style="margin: 0; font-size: 14px; font-weight: 500; line-height: 19px; letter-spacing: -0.07px; color: #666666; color: #4c1d95">My responsibilities</p><p style="margin: 0; font-size: 14px; font-weight: 500; line-height: 19px; letter-spacing: -0.07px; color: #666666; text-align: justify">End-to-end: problem framing, user research, competitive positioning, product strategy, information architecture, interaction design, and a high-fidelity clickable prototype.</p><p style="margin: 0; font-size: 14px; font-weight: 500; line-height: 19px; letter-spacing: -0.07px; color: #666666; color: #4c1d95">Outcome</p><p style="margin: 0; font-size: 14px; font-weight: 500; line-height: 19px; letter-spacing: -0.07px; color: #666666; text-align: justify">A working prototype covering the full loop: discover, create, open, connect, and built around one core interaction: a bidirectional map + timeline.</p></div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px; margin-top: 60px"><h2 class="ssm-h2" style="margin: 0; font-size: 38px; font-weight: 600; line-height: 41px; letter-spacing: -1.33px; color: #000000">Problem</h2><p style="margin: 0; font-size: 15px; line-height: 22.5px; text-align: justify; color: #475569">Digital communication is optimized for immediacy, not for meaning that unfolds over time. That's not a gap I inferred from my own solution. It's a pattern that shows up consistently across the products people already use.</p>
<div style="display: flex; flex-wrap: wrap; gap: 20px; margin-top: 22px"><div style="flex: 1 1 260px; min-width: 0; padding: 22px; border-radius: 24px; background: #ffffff; display: flex; flex-direction: column; gap: 12px"><p style="margin: 0; font-size: 18px; font-weight: 600; line-height: 21.6px; color: #020617">Products optimize for now</p><p style="margin: 0; font-size: 17px; line-height: 28px; letter-spacing: -0.17px; color: #666666">Messages are meant to be read immediately. Stories expire. Feeds rank recency over relevance, leaving no place for content tied to a specific past or future moment.</p></div><div style="flex: 1 1 260px; min-width: 0; padding: 22px; border-radius: 24px; background: #ffffff; display: flex; flex-direction: column; gap: 12px"><p style="margin: 0; font-size: 18px; font-weight: 600; line-height: 21.6px; color: #020617">Memories are archived, not experienced</p><p style="margin: 0; font-size: 17px; line-height: 28px; letter-spacing: -0.17px; color: #666666">Photo libraries resurface content algorithmically, on the platform's schedule, not the user's. It happens to people, rather than being chosen.</p></div><div style="flex: 1 1 260px; min-width: 0; padding: 22px; border-radius: 24px; background: #ffffff; display: flex; flex-direction: column; gap: 12px"><p style="margin: 0; font-size: 18px; font-weight: 600; line-height: 21.6px; color: #020617">Place is metadata, not interaction</p><p style="margin: 0; font-size: 17px; line-height: 28px; letter-spacing: -0.17px; color: #666666">Location is a tag on a post, not a way to navigate. No product asks: what happened here, at a different time?</p></div></div></div>

<div style="display: flex; flex-direction: column; gap: 10px; margin-top: 60px"><h2 class="ssm-h2" style="margin: 0; font-size: 38px; font-weight: 600; line-height: 41px; letter-spacing: -1.33px; color: #000000">Persona</h2>
<div style="display: flex; flex-wrap: wrap; gap: 20px 36px"><button type="button" onClick="{{tmZoom.jane}}" aria-label="Enlarge persona: Jane" style="flex: 1 1 320px; min-width: 0; padding: 0; border: 0; background: transparent; cursor: zoom-in; border-radius: 16px"><img src="assets/tm-persona-jane-1.jpg" alt="Meet Jane: curious to explore the past and how it shapes the present and future. Quote: I would travel to southern Illinois in 2017 to see the eclipse." style="display: block; width: 100%; height: auto; aspect-ratio: 500 / 300; object-fit: contain; border-radius: 16px; background: #ffffff"></button><button type="button" onClick="{{tmZoom.mark}}" aria-label="Enlarge persona: Mark" style="flex: 1 1 320px; min-width: 0; padding: 0; border: 0; background: transparent; cursor: zoom-in; border-radius: 16px"><img src="assets/tm-persona-mark-1.jpg" alt="Meet Mark: misses his high school friends and wants to relive that time. Quotes: I would go back to my high school; I would travel to the future to ask if I am happy." style="display: block; width: 100%; height: auto; aspect-ratio: 500 / 300; object-fit: contain; border-radius: 16px; background: #ffffff"></button></div>
<div style="display: flex; flex-wrap: wrap; gap: 20px 10px; margin-top: 10px">
<div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 6px"><p style="margin: 0; font-size: 17px; line-height: 28px; letter-spacing: -0.17px; color: #4c1d95">Design challenge:</p><p style="margin: 0; font-size: 14px; font-weight: 500; line-height: 19px; letter-spacing: -0.07px; color: #666666">How do you make time and place? Not just content, things people can deliberately navigate, rather than passively experience?</p></div>
<div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 6px"><p style="margin: 0; font-size: 17px; line-height: 28px; letter-spacing: -0.17px; color: #4c1d95">Success criteria</p><ul style="margin: 0; padding-left: 20px;  font-size: 14px; font-weight: 500; line-height: 19px; letter-spacing: -0.07px; color: #666666"><li>A first-time user creates and places a capsule with no instruction.</li><li>A user finds something meaningful near their location within seconds.</li><li>People schedule content for the future, not just the present.</li></ul></div>
</div></div>

<div style="display: flex; flex-direction: column; gap: 22px; margin-top: 60px"><h2 class="ssm-h2" style="margin: 0; font-size: 38px; font-weight: 600; line-height: 41px; letter-spacing: -1.33px; color: #000000">Research</h2>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px"><span style="padding: 7px 14px; border-radius: 999px; background: #ffffff; border: 1px solid #d4d4d8; font-size: 14px; font-weight: 500; color: #666666; white-space: nowrap">Research question</span><span aria-hidden="true" style="font-size: 22px; color: #000000">→</span><span style="padding: 7px 14px; border-radius: 999px; background: #ffffff; border: 1px solid #d4d4d8; font-size: 14px; font-weight: 500; color: #666666; white-space: nowrap">Interviews</span><span aria-hidden="true" style="font-size: 22px; color: #000000">→</span><span style="padding: 7px 14px; border-radius: 999px; background: #ffffff; border: 1px solid #d4d4d8; font-size: 14px; font-weight: 500; color: #666666; white-space: nowrap">Affinity mapping</span><span aria-hidden="true" style="font-size: 22px; color: #000000">→</span><span style="padding: 7px 14px; border-radius: 999px; background: #ffffff; border: 1px solid #d4d4d8; font-size: 14px; font-weight: 500; color: #666666; white-space: nowrap">Insights</span><span aria-hidden="true" style="font-size: 22px; color: #000000">→</span><span style="padding: 7px 14px; border-radius: 999px; background: #ffffff; border: 1px solid #d4d4d8; font-size: 14px; font-weight: 500; color: #666666; white-space: nowrap">Product decisions</span></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 26px 74px"><div style="display: flex; flex-direction: column; gap: 8px"><p style="margin: 0; font-size: 17px; line-height: 28px; letter-spacing: -0.17px; color: #4c1d95">RESEARCH QUESTION</p><p style="margin: 0; font-size: 14px; font-weight: 500; line-height: 19px; letter-spacing: -0.07px; color: #666666">Is "time travel" a real motivating frame, or just an appealing metaphor? What would make someone trust a stranger's app enough to leave something personal at a real GPS coordinate?</p></div><div style="display: flex; flex-direction: column; gap: 8px"><p style="margin: 0; font-size: 17px; line-height: 28px; letter-spacing: -0.17px; color: #4c1d95">SAMPLE AND RIGOR, STATED PLAINLY</p><p style="margin: 0; font-size: 14px; font-weight: 500; line-height: 19px; letter-spacing: -0.07px; color: #666666">Two interviews are shown here as illustrative primary research, not a validated finding, directional, not saturated. A production study would extend to 8–12 participants across more varied relationships to time before treating any decision as validated.</p></div><div style="display: flex; flex-direction: column; gap: 8px"><p style="margin: 0; font-size: 17px; line-height: 28px; letter-spacing: -0.17px; color: #4c1d95">METHOD</p><p style="margin: 0; font-size: 14px; font-weight: 500; line-height: 19px; letter-spacing: -0.07px; color: #666666">Semi-structured 1:1 interviews, the right method for unprompted emotional recall ("what would you time travel to, and why?"), which needs open association rather than a forced-choice survey instrument.</p></div><div style="display: flex; flex-direction: column; gap: 8px"><p style="margin: 0; font-size: 17px; line-height: 28px; letter-spacing: -0.17px; color: #4c1d95">WHERE THE BIAS IS</p><p style="margin: 0; font-size: 14px; font-weight: 500; line-height: 19px; letter-spacing: -0.07px; color: #666666">Both quotes skew toward past-nostalgia over future-self framing, worth naming, since it could quietly bias the product toward "revisit" over "send forward" if left unchecked. A larger study should specifically recruit for future-oriented use cases.</p></div></div></div>

<div style="display: flex; flex-direction: column; gap: 14px; margin-top: 60px"><h2 class="ssm-h2" style="margin: 0; font-size: 38px; font-weight: 600; line-height: 41px; letter-spacing: -1.33px; color: #000000">Competitive analysis</h2><p style="margin: 0; font-size: 17px; line-height: 28px; letter-spacing: -0.17px; color: #666666">Time Map has no direct competitors. Instead, it competes with a set of behavioral alternatives, each addressing only one part of the underlying user need.</p>
<div style="overflow-x: auto"><table style="width: 100%; min-width: 620px; border-collapse: separate; border-spacing: 1px; background: #000000; table-layout: fixed"><thead><tr><th scope="col" style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Product</th><th scope="col" style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Primary job</th><th scope="col" style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Strength</th><th scope="col" style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Missing opportunity</th></tr></thead><tbody><tr><th scope="row" style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Instagram</th><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Share experiences</td><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Identity + social graph</td><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">No delayed delivery or intentional rediscovery</td></tr><tr><th scope="row" style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Apple / Google Photos</th><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Preserve memories</td><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Personal archive</td><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Algorithmically resurfaced, not intentionally created for the future</td></tr><tr><th scope="row" style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">FutureMe</th><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Write to future self</td><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Delayed communication</td><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">No spatial context or shared discovery</td></tr><tr><th scope="row" style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">BeReal</th><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Capture the present</td><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Authenticity</td><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">No long-term memory or future interaction</td></tr><tr><th scope="row" style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Snapchat Memories</th><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Save moments</td><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Personal archive</td><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Time exists, but place isn't central</td></tr><tr><th scope="row" style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Timehop</th><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Rediscover past content</td><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Nostalgia</td><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">No path to intentionally create future experiences</td></tr><tr><th scope="row" style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Geocaching</th><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Discover location content</td><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Exploration</td><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">No emotional storytelling or temporal dimension</td></tr></tbody></table></div></div>

<div style="display: flex; flex-direction: column; gap: 14px; margin-top: 60px"><h2 class="ssm-h2" style="margin: 0; font-size: 38px; font-weight: 600; line-height: 41px; letter-spacing: -1.33px; color: #000000">Product Opportunity</h2><p style="margin: 0; font-size: 17px; line-height: 28px; letter-spacing: -0.17px; color: #666666">Existing products treat people, place, and time as separate dimensions. Time Map treats all three as part of one interaction model, so communication is intentionally discovered, rather than immediately consumed.</p><p style="margin: 0; font-size: 17px; line-height: 28px; letter-spacing: -0.17px; color: #666666">This isn't "time travel" as a gimmick. It's intentional memory: giving people control over when and where something gets rediscovered, instead of leaving that to an algorithm or to chance.</p>
<div style="overflow-x: auto"><table style="width: 100%; min-width: 620px; border-collapse: separate; border-spacing: 1px; background: #000000; table-layout: fixed"><thead><tr><th scope="col" style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Product</th><th scope="col" style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">User Group</th><th scope="col" style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Location</th><th scope="col" style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Time Feature</th></tr></thead><tbody><tr><th scope="row" style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">WhatsApp</th><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">✓</td><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">✗</td><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Present</td></tr><tr><th scope="row" style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Instagram</th><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">✓</td><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Optional</td><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Present</td></tr><tr><th scope="row" style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Google Photos</th><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Self</td><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Optional</td><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Past</td></tr><tr><th scope="row" style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">FutureMe</th><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Self</td><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">✗</td><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Future</td></tr><tr><th scope="row" style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Geocaching</th><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Community</td><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">✓</td><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #ffffff">Present</td></tr><tr><th scope="row" style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #efe9f7">Time Map</th><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #efe9f7">Self, Friends, Public</td><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #efe9f7">✓</td><td style="padding: 9px 12px; font-size: 12px; line-height: 1.35; color: #000000; text-align: left; font-weight: 400; vertical-align: middle; background: #efe9f7">Past, Present, Future</td></tr></tbody></table></div>
<p style="margin: 0; font-size: 17px; line-height: 28px; letter-spacing: -0.17px; color: #666666">No existing product spans all three dimensions across all three time horizons. That's the opportunity, not "Instagram plus FutureMe."</p></div>

<div style="display: flex; flex-direction: column; gap: 14px; margin-top: 60px"><h2 class="ssm-h2" style="margin: 0; font-size: 38px; font-weight: 600; line-height: 41px; letter-spacing: -1.33px; color: #000000">From Insight to Decision</h2><p style="margin: 0; font-size: 17px; line-height: 28px; letter-spacing: -0.17px; color: #666666">Each research insight maps to one specific, testable design decision, not a general design principle.</p><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; padding: 26px 36px; border-radius: 20px; background: #ffffff; border: 1px solid #e4e4e7"><p style="flex: 1 1 300px; margin: 0; font-size: 17px; line-height: 28px; color: #000000">People remember places as strongly as they remember time</p><span aria-hidden="true" style="font-size: 22px; color: #000000">→</span><p style="flex: 1 1 300px; margin: 0; font-size: 17px; font-weight: 600; line-height: 28px; color: #000000">Location becomes a primary interaction, not metadata</p></div><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; padding: 26px 36px; border-radius: 20px; background: #ffffff; border: 1px solid #e4e4e7"><p style="flex: 1 1 300px; margin: 0; font-size: 17px; line-height: 28px; color: #000000">Delayed communication carries emotional weight for users</p><span aria-hidden="true" style="font-size: 22px; color: #000000">→</span><p style="flex: 1 1 300px; margin: 0; font-size: 17px; font-weight: 600; line-height: 28px; color: #000000">"When to open" is a mandatory, first-class step not a buried toggle</p></div><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; padding: 26px 36px; border-radius: 20px; background: #ffffff; border: 1px solid #e4e4e7"><p style="flex: 1 1 300px; margin: 0; font-size: 17px; line-height: 28px; color: #000000">Public sharing requires clear privacy boundaries before people post anything personal</p><span aria-hidden="true" style="font-size: 22px; color: #000000">→</span><p style="flex: 1 1 300px; margin: 0; font-size: 17px; font-weight: 600; line-height: 28px; color: #000000">Three privacy tiers (Personal / Friends / Public), presented as a required step</p></div><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; padding: 26px 36px; border-radius: 20px; background: #ffffff; border: 1px solid #e4e4e7"><p style="flex: 1 1 300px; margin: 0; font-size: 17px; line-height: 28px; color: #000000">People think about memories chronologically, not by exact date</p><span aria-hidden="true" style="font-size: 22px; color: #000000">→</span><p style="flex: 1 1 300px; margin: 0; font-size: 17px; font-weight: 600; line-height: 28px; color: #000000">A draggable timeline replaces a conventional date picker as the primary browsing model</p></div></div>

<div style="display: flex; flex-direction: column; gap: 14px; margin-top: 60px"><h2 class="ssm-h2" style="margin: 0; font-size: 38px; font-weight: 600; line-height: 41px; letter-spacing: -1.33px; color: #4c1d95">Product Strategy</h2><p style="margin: 0; font-size: 17px; line-height: 28px; letter-spacing: -0.17px; color: #666666">Each research insight maps to one specific, testable design decision, not a general design principle.</p>
<div style="display: flex; flex-wrap: wrap; gap: 30px 77px; margin-top: 20px">
<div style="flex: 524 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 10px"><p style="margin: 0; font-size: 17px; line-height: 28px; letter-spacing: -0.17px; color: #4c1d95">Value proposition</p><p style="margin: 0; font-size: 17px; font-weight: 500; line-height: 28px; color: #333333">Leave something for a place and a time, not just a person.</p><p style="margin: 0; font-size: 17px; line-height: 28px; letter-spacing: -0.17px; color: #4c1d95; margin-top: 34px">Core interaction model</p><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px"><span style="padding: 7px 14px; border-radius: 999px; background: #ffffff; border: 1px solid #d4d4d8; font-size: 14px; font-weight: 500; color: #666666; white-space: nowrap">People + Place + Time</span><span aria-hidden="true" style="font-size: 22px; color: #000000">→</span><span style="padding: 7px 14px; border-radius: 999px; background: #ffffff; border: 1px solid #d4d4d8; font-size: 14px; font-weight: 500; color: #666666; white-space: nowrap">Memory Capsule</span><span aria-hidden="true" style="font-size: 22px; color: #000000">→</span><span style="padding: 7px 14px; border-radius: 999px; background: #ffffff; border: 1px solid #d4d4d8; font-size: 14px; font-weight: 500; color: #666666; white-space: nowrap">Discovery</span><span aria-hidden="true" style="font-size: 22px; color: #000000">→</span><span style="padding: 7px 14px; border-radius: 999px; background: #ffffff; border: 1px solid #d4d4d8; font-size: 14px; font-weight: 500; color: #666666; white-space: nowrap">Connection</span></div></div>
<div style="flex: 438 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 10px"><p style="margin: 0; font-size: 17px; line-height: 28px; letter-spacing: -0.17px; color: #4c1d95">North Star Metric</p><p style="margin: 0; font-size: 14px; font-weight: 500; line-height: 19px; letter-spacing: -0.07px; color: #666666">Capsules opened per active user per week: rewards the full loop (leave, discover, open), rather than one-sided posting or passive scrolling.</p><p style="margin: 0; font-size: 17px; line-height: 28px; letter-spacing: -0.17px; color: #4c1d95; margin-top: 12px">MVP scope</p><p style="margin: 0; font-size: 14px; font-weight: 500; line-height: 19px; letter-spacing: -0.07px; color: #666666">Map + timeline browsing, capsule creation (media, schedule, privacy), capsule opening (map + AR), and a minimal social layer (profile, comments, friend sharing). 3D-scan capsules and public discovery algorithms are deliberately out of scope for v1.</p></div>
</div></div>

<div style="display: flex; flex-direction: column; gap: 10px; margin-top: 60px"><h2 class="ssm-h2" style="margin: 0; font-size: 38px; font-weight: 600; line-height: 41px; letter-spacing: -1.33px; color: #000000">Design Process</h2><p style="margin: 0; font-size: 17px; line-height: 28px; letter-spacing: -0.17px; color: #4c1d95">Information architecture</p><p style="margin: 0; font-size: 17px; line-height: 28px; letter-spacing: -0.17px; color: #666666">Two coordinate systems shown at once, space (map) and time (timeline scrubber) with a Map/AR toggle on the same location context. This replaces a conventional tab bar: past, present, and future are all reached by moving one scrubber, not by navigating to separate screens.</p>
<div style="display: flex; flex-wrap: wrap; gap: 30px 100px; margin-top: 26px; padding-left: 22px">
<div style="flex: 1 1 320px; min-width: 0; padding-left: 20px; border-left: 4px solid #cac5f4; display: flex; flex-direction: column; gap: 12px"><p style="margin: 0; font-size: 17px; font-weight: 600; line-height: 28px; color: #000000">Why a timeline instead of a calendar?</p><p style="margin: 0; font-size: 17px; line-height: 28px; letter-spacing: -0.17px; color: #666666"><em>Observation:</em> people think about memories chronologically, not by exact date.</p><p style="margin: 0; font-size: 17px; line-height: 28px; letter-spacing: -0.17px; color: #666666"><em>Decision:</em> an interactive, draggable timeline instead of a traditional date picker.</p><p style="margin: 0; font-size: 17px; line-height: 28px; letter-spacing: -0.17px; color: #666666"><em>Impact:</em> lower cognitive effort, reinforcing the "time travel" mental model instead of feeling like form-filling.</p></div>
<div style="flex: 1 1 320px; min-width: 0; padding-left: 20px; border-left: 4px solid #f7d3b1; display: flex; flex-direction: column; gap: 12px"><p style="margin: 0; font-size: 17px; font-weight: 600; line-height: 28px; color: #000000">Capsule creation flow</p><p style="margin: 0; font-size: 17px; line-height: 28px; letter-spacing: -0.17px; color: #666666">Sequenced concrete → abstract: media → message → open date → privacy → confirmation. The hardest decision — privacy and audience — comes after the user is already invested in the content, which should improve completion without hiding the choice.</p></div>
</div></div>

<div style="display: flex; flex-direction: column; gap: 10px; margin-top: 70px"><h2 class="ssm-h2" style="margin: 0; font-size: 38px; font-weight: 600; line-height: 41px; letter-spacing: -1.33px; color: #000000">Final Solution</h2><p style="margin: 0; font-size: 17px; line-height: 28px; letter-spacing: -0.17px; color: #666666">Four flows built around one core interaction: the bidirectional map + timeline</p></div>
<div style="display: flex; flex-wrap: wrap; gap: 30px 60px; align-items: flex-start; padding-left: 30px; margin-top: 70px">
<div style="flex: 1 1 360px; max-width: 483px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
<p style="margin: 0; font-size: 17px; line-height: 28px; letter-spacing: -0.17px; color: #4c1d95">01</p><p style="margin: 0; font-size: 17px; line-height: 28px; color: #000000">Discover Through Time</p>
<p style="margin: 0; font-size: 14px; font-weight: 500; line-height: 19px; letter-spacing: -0.07px; color: #666666"><strong style="font-weight: 600; color: #000000">User problem.</strong> Location-specific memories are undiscoverable once a feed moves on.</p><p style="margin: 0; font-size: 14px; font-weight: 500; line-height: 19px; letter-spacing: -0.07px; color: #666666"><strong style="font-weight: 600; color: #000000">Design rationale.</strong> A draggable timeline paired with a live map lets users scrub between past and future years while staying anchored to one place.</p><p style="margin: 0; font-size: 14px; font-weight: 500; line-height: 19px; letter-spacing: -0.07px; color: #666666"><strong style="font-weight: 600; color: #000000">Final UI.</strong> Map view with year selector and timeline scrubber; capsule density shown as count badges (e.g., "99+") near the user's pin.</p>
</div>

</div>
<div style="display: flex; flex-wrap: wrap; gap: 30px 60px; align-items: flex-start; padding-left: 30px; margin-top: 70px">

<p style="margin: 0; font-size: 17px; line-height: 28px; letter-spacing: -0.17px; color: #4c1d95">02</p><p style="margin: 0; font-size: 17px; line-height: 28px; color: #000000">Create a Capsule</p>
<p style="margin: 0; font-size: 14px; font-weight: 500; line-height: 19px; letter-spacing: -0.07px; color: #666666"><strong style="font-weight: 600; color: #000000">User problem.</strong> No product treats "send to the future" as equal to "post now."</p><p style="margin: 0; font-size: 14px; font-weight: 500; line-height: 19px; letter-spacing: -0.07px; color: #666666"><strong style="font-weight: 600; color: #000000">Design rationale.</strong> Choosing the medium is its own step: image, video, audio, music, or text, because each is a different sensory way to share a memory, not just a file-type picker.</p><p style="margin: 0; font-size: 14px; font-weight: 500; line-height: 19px; letter-spacing: -0.07px; color: #666666"><strong style="font-weight: 600; color: #000000">Final UI.</strong> Segmented progress bar; choose medium (image, video, audio recording, music, or text), then capture or upload content.</p>
</div>

"true"><img src="assets/tm-cap-photo.jpg" alt="" style="display: block; width: 183px; height: 396px; object-fit: cover; border-radius: 30px; background: #000000"></li><li style="flex: 0 0 183px; width: 183px" aria-hidden="true"><img src="assets/tm-cap-video.jpg" alt="" style="display: block; width: 183px; height: 396px; object-fit: cover; border-radius: 30px; background: #000000"></li><li style="flex: 0 0 183px; width: 183px" aria-hidden="true"><img src="assets/tm-cap-audio.jpg" alt="" style="display: block; width: 183px; height: 396px; object-fit: cover; border-radius: 30px; background: #000000"></li><li style="flex: 0 0 183px; width: 183px" aria-hidden="true"><img src="assets/tm-cap-music.jpg" alt="" style="display: block; width: 183px; height: 396px; object-fit: cover; border-radius: 30px; background: #000000"></li><li style="flex: 0 0 183px; width: 183px" aria-hidden="true"><img src="assets/tm-cap-text.jpg" alt="" style="display: block; width: 183px; height: 396px; object-fit: cover; border-radius: 30px; background: #000000"></li></ul></div>
</div>

<p style="margin: 0; font-size: 17px; line-height: 28px; letter-spacing: -0.17px; color: #4c1d95">03</p><p style="margin: 0; font-size: 17px; line-height: 28px; color: #000000">Edit Capsule</p>
<p style="margin: 0; font-size: 14px; font-weight: 500; line-height: 19px; letter-spacing: -0.07px; color: #666666"><strong style="font-weight: 600; color: #000000">User problem.</strong> Delayed communication and public sharing both carry real consequences, so schedule and audience can't feel like buried settings.</p><p style="margin: 0; font-size: 14px; font-weight: 500; line-height: 19px; letter-spacing: -0.07px; color: #666666"><strong style="font-weight: 600; color: #000000">Design rationale.</strong> Two dedicated parts within this step: first when to open (a required date, not an optional toggle), then who sees it (privacy tier plus friend sharing), each its own decision, not one combined form.</p><p style="margin: 0; font-size: 14px; font-weight: 500; line-height: 19px; letter-spacing: -0.07px; color: #666666"><strong style="font-weight: 600; color: #000000">Final UI.</strong> Part 1: message + open date. Part 2: privacy (Personal / Friends / Public) and friend picker for shared capsules.</p>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 30px 60px; align-items: flex-start; padding-left: 30px; margin-top: 70px">

<div style="padding: 36px; border-radius: 34px; background: #ffffff; display: flex; flex-direction: column; gap: 18px">
<p style="margin: 0; font-size: 12px; font-weight: 700; line-height: 12px; letter-spacing: 0.96px; text-transform: uppercase; color: #207341">Project Direction</p>
<p style="margin: 0; font-size: 14px; font-weight: 500; line-height: 18.9px; letter-spacing: -0.07px; text-align: justify; color: #666666">This piece begins with a longing for land, the pull toward a place that isn't just geography but memory. At its center is a field of wind-blown grass, color and thickness and length shifting over time as though the field itself were breathing, alive with the same restlessness as memory. Hidden inside that movement is the outline of a specific New York City neighborhood, its streets and blocks quietly shaping how the grass grows. Nature and city, memory and place, drawn from the same root.</p>
<p style="margin: 0; font-size: 14px; font-weight: 500; line-height: 18.9px; letter-spacing: -0.07px; text-align: justify; color: #666666">The lines that move through the grass aren't just wind, they're memory made visible, motion carrying the trace of a place that's been lived in, walked through, held onto. When a viewer's hand enters the frame, a filter finds the fingers and traces those same lines across the skin, city becoming skin, skin becoming map. It's a quiet cue: the viewer isn't only watching the landscape, they're being written into it. To look at the grass is to become part of what it remembers: human, nature, and the wider universe folded into the same vivid, moving line.</p>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px">

<div style="padding: 22px; border-radius: 24px; background: #ffffff; display: flex; flex-direction: column; gap: 12px"><p style="margin: 0; font-size: 17px; line-height: 28px; letter-spacing: -0.17px; color: #666666">02 . METHOD</p><p style="margin: 0; font-size: 18px; font-weight: 600; line-height: 21.6px; color: #020617">Prototype Probe</p><p style="margin: 0; font-size: 14px; font-weight: 500; line-height: 18.9px; letter-spacing: -0.07px; color: #7c7e7a">How noise, map data, and hand-tracking are built into one system.</p></div>

<div style="padding: 36px; border-radius: 34px; background: #ffffff; display: flex; flex-direction: column; gap: 20px; font-size: 14px; font-weight: 500; line-height: 18.9px; letter-spacing: -0.07px; color: #666666">
<p style="margin: 0; font-size: 12px; font-weight: 700; line-height: 12px; letter-spacing: 0.96px; text-transform: uppercase; color: #207341">Prototype Probe</p>
<p style="margin: 0">How to Achieve</p>
<p style="margin: 0">Dynamic wind-blown grass:</p>
<p style="margin: 0">Use Perlin noise to drive natural, non-repeating motion. Let color, thickness, and length evolve continuously rather than looping, so the field reads as alive rather than animated.</p>
<p style="margin: 0">Map integration:</p>
<p style="margin: 0">Convert the chosen NYC area into geographic data (street lines, block shapes) and use it to steer how grass is distributed and grown — density and direction following the map rather than sitting on top of it.</p>
<p style="margin: 0">Hand tracking and interaction:</p>
<p style="margin: 0">Use a hand-tracking library to detect when a hand enters frame, then project the map lines onto the fingers in real time, tying the interaction to touch rather than passive viewing.</p>
<p style="margin: 0">Animation and rendering:</p>
<p style="margin: 0">Update each blade's state every frame inside draw(), rendering position, color, and length together so the field reads as one continuous motion rather than isolated objects.</p>
<p style="margin: 0">Interaction handling:</p>
<p style="margin: 0">Listen for hand presence and movement, and let the grass's visual behavior respond with subtle shifts in color or motion, so the piece feels responsive rather than scripted.</p>
<p style="margin: 0"># First Sketch</p>
<p style="margin: 0">A first pass in p5.js: 200 generative lines, each seeded from a random point. Every frame, each line extends slightly along an angle drawn from Perlin noise: a small, simple rule that produces something that reads as wind. It's the seed the rest of the piece grows from.</p>
</div>

<div style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<p style="margin: 0">System Design</p>
<p style="margin: 0">On button press, the sequence balances genuine unpredictability with logic that stays legible and satisfying:</p>
<p style="margin: 0">1. Two stepper motors independently rotate the eyes in ¼-revolution increments, up to 2 full revolutions - 8 discrete symbol positions per eye</p>
<p style="margin: 0">2. A random value per motor is mapped to a symbol position via modulus-based logic; the remainder sets the final resting symbol</p>
<p style="margin: 0">3. Matching symbols on both eyes trigger a servo motor to open the mouth</p>
<p style="margin: 0">4. The mouth holds open 2 seconds to dispense candy, then closes automatically</p>

<p style="margin: 0">Reflection</p>
<p style="margin: 0">This project sharpened my ability to bridge software logic and physical systems by translating computational randomness into tangible motion, and coordinating multiple motors with tight timing precision.</p>
<p style="margin: 0">It deepened my interest in physical computing as a storytelling medium, where code doesn't just run in the background, but directly shapes how someone moves through and experiences a moment.</p>

<div class="ls" style="width: 100%; max-width: 1120px; margin: 0 auto; padding: 50px 20px 60px; box-sizing: border-box; font-family: 'Inter', sans-serif; color: #000000; display: flex; flex-direction: column; align-items: center; gap: 28px">
<p class="ls-title" style="margin: 0; text-align: center; font-size: 56px; font-weight: 700; line-height: 56px; letter-spacing: -2.8px; color: #000000">Light and Shadow</p>
<img src="assets/ls-white.jpg" alt="Four white plaster sculpture forms on a round platform against a dark gray wall" style="display: block; width: 100%; height: auto; aspect-ratio: 1077 / 720; object-fit: contain; border-radius: 34px">
<img src="assets/ls-tri.jpg" alt="Light and Shadows I, II and III: as the forms turn, their shadow gradually becomes a human profile" style="display: block; width: 100%; height: auto; aspect-ratio: 2460 / 1154; object-fit: contain; border-radius: 34px">
<div style="width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 20px; margin-top: 20px">
<p class="ls-p" style="margin: 0; font-family: 'Bodoni Moda', serif; font-size: 32px; font-weight: 400; line-height: 38.4px; letter-spacing: -0.96px; color: #000000">Light and Shadows</p>
<p class="ls-p" style="margin: 0; font-family: 'Bodoni Moda', serif; font-size: 32px; font-weight: 400; line-height: 38.4px; letter-spacing: -0.96px; color: #000000">(I, II and III) Sculpture studies, fired clay, 2020</p>
<p class="ls-p" style="margin: 0; font-family: 'Bodoni Moda', serif; font-size: 32px; font-weight: 400; line-height: 38.4px; letter-spacing: -0.96px; color: #000000; margin-top: 60px">“The prisoners see only the shadows cast by these statues and other objects; and having lived in the cave from childhood, they no longer recall any other reality. They do not suspect that these shadows are but imperfect images of objects that they cannot see; and consequently they mistake the shadows for the real.”</p>
<p class="ls-p" style="margin: 0; font-family: 'Bodoni Moda', serif; font-size: 32px; font-weight: 400; line-height: 38.4px; letter-spacing: -0.96px; color: #000000">--Plato, Allegory of the Cave</p>
<p class="ls-p" style="margin: 0; font-family: 'Bodoni Moda', serif; font-size: 32px; font-weight: 400; line-height: 38.4px; letter-spacing: -0.96px; color: #000000; margin-top: 20px">Overview</p>
<p class="ls-p" style="margin: 0; font-family: 'Bodoni Moda', serif; font-size: 32px; font-weight: 400; line-height: 38.4px; letter-spacing: -0.96px; color: #000000">Shadows and Light explores the relationship between perception, reality, and identity through sculpture, light, and motion. Inspired by Plato's Allegory of the Cave, the work questions how people construct reality from incomplete information and how perception shapes our understanding of ourselves and the world.</p>
<p class="ls-p" style="margin: 0; font-family: 'Bodoni Moda', serif; font-size: 32px; font-weight: 400; line-height: 38.4px; letter-spacing: -0.96px; color: #000000">Rather than treating sculpture as a static object, the installation uses light, shadow, and rotation as equally important materials. As the sculpture slowly turns, fragmented forms align to produce a complete human silhouette through shadow, revealing an image that exists only temporarily. The work invites viewers to consider whether reality lies in the physical object or in the perception it creates.</p>
<p class="ls-p" style="margin: 0; font-family: 'Bodoni Moda', serif; font-size: 32px; font-weight: 400; line-height: 38.4px; letter-spacing: -0.96px; color: #000000">Concept</p>
<p class="ls-p" style="margin: 0; font-family: 'Bodoni Moda', serif; font-size: 32px; font-weight: 400; line-height: 38.4px; letter-spacing: -0.96px; color: #000000">My artistic practice often investigates philosophical questions surrounding existence, memory, identity, and human perception. During this period, my work shifted from formal explorations of geometry and found objects toward more personal questions about cultural identity and selfhood.</p>
<p class="ls-p" style="margin: 0; font-family: 'Bodoni Moda', serif; font-size: 32px; font-weight: 400; line-height: 38.4px; letter-spacing: -0.96px; color: #000000">Shadows and Light reflects this transition. It asks how identity is constructed between what is physically present and what is mentally perceived—between the tangible self and the image we project onto the world.</p>
<p class="ls-p" style="margin: 0; font-family: 'Bodoni Moda', serif; font-size: 32px; font-weight: 400; line-height: 38.4px; letter-spacing: -0.96px; color: #000000">The installation draws directly from Plato's Allegory of the Cave, where prisoners mistake shadows for reality because they have never experienced anything else. By transforming fragmented objects into a coherent shadow portrait, the work suggests that our understanding of reality is often assembled from incomplete perspectives.</p>
<p class="ls-p" style="margin: 0; font-family: 'Bodoni Moda', serif; font-size: 32px; font-weight: 400; line-height: 38.4px; letter-spacing: -0.96px; color: #000000">Process</p>
<p class="ls-p" style="margin: 0; font-family: 'Bodoni Moda', serif; font-size: 32px; font-weight: 400; line-height: 38.4px; letter-spacing: -0.96px; color: #000000">The sculpture consists of four independent plaster forms positioned on a rotating platform. Individually, each form appears abstract and disconnected. Only through the interaction of movement and light do the pieces combine into a recognizable human profile.</p>
<p class="ls-p" style="margin: 0; font-family: 'Bodoni Moda', serif; font-size: 32px; font-weight: 400; line-height: 38.4px; letter-spacing: -0.96px; color: #000000">Rotation introduces time as a material, allowing the sculpture to continually shift between abstraction and representation. The shadow becomes a temporary image that exists only through the relationship between object, light, and viewer.</p>
</div>

<p style="margin: 0; text-align: center; font-size: 17px; line-height: 28px; letter-spacing: -0.17px; color: #666666">2021 · An exploration of light, reflection, and spatial perception.</p>

<div class="yb" style="width: 100%; max-width: 1120px; margin: 0 auto; padding: 50px 20px 60px; box-sizing: border-box; font-family: 'Inter', sans-serif; color: #000000; display: flex; flex-direction: column; align-items: center; gap: 28px">
<p class="ls-title" style="margin: 0; text-align: center; font-size: 56px; font-weight: 700; line-height: 56px; letter-spacing: -2.8px; color: #000000">Yellow Box</p>
<img src="assets/yb-front.jpg" alt="Yellow Box: a long box of crumpled yellow plastic standing in a wet green field under misty mountains" style="display: block; width: 100%; max-width: 1000px; height: auto; aspect-ratio: 1000 / 560; object-fit: cover; border-radius: 34px">
<img src="assets/yb-people.jpg" alt="Three people walk across the field toward the yellow box under a dark, cloudy sky" style="display: block; width: 100%; max-width: 1000px; height: auto; aspect-ratio: 1000 / 560; object-fit: cover; border-radius: 34px">
<div style="width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 20px; margin-top: 20px">
<p class="ls-p" style="margin: 0; font-family: 'Bodoni Moda', serif; font-size: 32px; font-weight: 400; line-height: 38.4px; letter-spacing: -0.96px; color: #000000">Yellow Box<br>Landscape Installation, plastic bags, 2019</p>
<p class="ls-p" style="margin: 0; font-family: 'Bodoni Moda', serif; font-size: 32px; font-weight: 400; line-height: 38.4px; letter-spacing: -0.96px; color: #000000">In the midst of a sprawling, untouched landscape, a box stands out as a striking anomaly, evoking the iconic monolith from "2001: A Space Odyssey". This incongruity in the natural setting is stark - a man-made object in a place seemingly untouched by modernity.</p>
<p class="ls-p" style="margin: 0; font-family: 'Bodoni Moda', serif; font-size: 32px; font-weight: 400; line-height: 38.4px; letter-spacing: -0.96px; color: #000000">As we gaze from afar, the box's plastic material takes on a deceiving texture, almost resembling wool, blurring the lines between the artificial and the natural.</p>
<p class="ls-p" style="margin: 0; font-family: 'Bodoni Moda', serif; font-size: 32px; font-weight: 400; line-height: 38.4px; letter-spacing: -0.96px; color: #000000">My installation, titled 'Yellow Box', stands as a warning against a dystopian future, illustrating the onset of a plastic invasion in the natural world.</p>
<p class="ls-p" style="margin: 0; font-family: 'Bodoni Moda', serif; font-size: 32px; font-weight: 400; line-height: 38.4px; letter-spacing: -0.96px; color: #000000">This work symbolizes the early stages of an environmental crisis, where synthetic materials begin to disrupt the harmony of natural landscapes.</p>
<p class="ls-p" style="margin: 0; font-family: 'Bodoni Moda', serif; font-size: 32px; font-weight: 400; line-height: 38.4px; letter-spacing: -0.96px; color: #000000">The box's imposing dimensions, standing 10 feet high, 10 feet wide, and stretching 65 feet in length, are intentionally chosen for impact. Its sheer scale and volume are designed to evoke a sense of terror when viewed up close, highlighting the overwhelming and intrusive nature of plastic pollution in our environment.</p>
<p class="ls-p" style="margin: 0; font-family: 'Bodoni Moda', serif; font-size: 32px; font-weight: 400; line-height: 38.4px; letter-spacing: -0.96px; color: #000000">To create this piece, I gathered thousands of used plastic bags, dyeing each one a vivid yellow.</p>
<p class="ls-p" style="margin: 0; font-family: 'Bodoni Moda', serif; font-size: 32px; font-weight: 400; line-height: 38.4px; letter-spacing: -0.96px; color: #000000">This color choice is deliberate – not only it ensures that the installation stands out against its surroundings, the color yellow is also often associated with caution, underlining a sense of warning and urgency.</p>
<p class="ls-p" style="margin: 0; font-family: 'Bodoni Moda', serif; font-size: 32px; font-weight: 400; line-height: 38.4px; letter-spacing: -0.96px; color: #000000">Beneath this bright, artificial skin lies a wooden frame, symbolizing the intrusion of man-made materials into natural environments.</p>
<p class="ls-p" style="margin: 0; font-family: 'Bodoni Moda', serif; font-size: 32px; font-weight: 400; line-height: 38.4px; letter-spacing: -0.96px; color: #000000">The box itself critiques humanity's neglectful impact on the delicate balance of our ecosystem.</p>
</div>
<img src="assets/yb-close.jpg" alt="Close-up of the crumpled yellow plastic surface against a misty mountain" style="display: block; width: 100%; max-width: 1000px; height: auto; aspect-ratio: 1000 / 560; object-fit: cover; border-radius: 34px">
<img src="assets/yb-side1.jpg" alt="The yellow box from the side, with village houses and forest behind" style="display: block; width: 100%; max-width: 1000px; height: auto; aspect-ratio: 1000 / 560; object-fit: cover; border-radius: 34px">

<sc-if value="{{d.isAB}}" hint-placeholder-val="{{ false }}">
<div class="ab" style="width: 100%; max-width: 1120px; margin: 0 auto; padding: 50px 20px 60px; box-sizing: border-box; font-family: 'Inter', sans-serif; color: #000000; display: flex; flex-direction: column; align-items: center; gap: 28px">
<p class="ls-title" style="margin: 0; text-align: center; font-size: 56px; font-weight: 700; line-height: 56px; letter-spacing: -2.8px; color: #000000">Ant Box</p>
<img src="assets/ab-front.jpg" alt="Ant Box: a clear acrylic cube lined with a copper-tape labyrinth, ants inside, stacked on a box holding the touch board, beside a speaker" style="display: block; width: 100%; max-width: 1000px; height: auto; aspect-ratio: 1000 / 560; object-fit: cover; border-radius: 34px">
<video src="assets/ab-ab.mp4" aria-label="Ant Box video: ants crossing the copper labyrinth trigger piano notes" autoplay="" muted="" loop="" playsinline="" controls="" preload="metadata" style="display: block; width: 100%; max-width: 1000px; height: auto; aspect-ratio: 1000 / 560; object-fit: cover; border-radius: 34px; background: #000000"></video>
<img src="assets/ab-angle.jpg" alt="Ant Box from above at an angle, the copper maze glowing on every face" style="display: block; width: 100%; max-width: 1000px; height: auto; aspect-ratio: 1000 / 560; object-fit: cover; border-radius: 34px">
<div style="width: 100%; max-width: 1000px; display: flex; flex-direction: column; gap: 20px; margin-top: 60px">
<p class="ls-p" style="margin: 0; font-family: 'Bodoni Moda', serif; font-size: 32px; font-weight: 400; line-height: 38.4px; letter-spacing: -0.96px; color: #000000">Ant Box</p>
<p class="ls-p" style="margin: 0; font-family: 'Bodoni Moda', serif; font-size: 32px; font-weight: 400; line-height: 38.4px; letter-spacing: -0.96px; color: #000000">Performance Installation, ants, Bare Conductive Touch Board, 2022</p>
<p class="ls-p" style="margin: 0; font-family: 'Bodoni Moda', serif; font-size: 32px; font-weight: 400; line-height: 38.4px; letter-spacing: -0.96px; color: #000000">My work Ant Box is an bio-art installation, of which I created during the ongoing COVID lockdown.</p>
<p class="ls-p" style="margin: 0; font-family: 'Bodoni Moda', serif; font-size: 32px; font-weight: 400; line-height: 38.4px; letter-spacing: -0.96px; color: #000000">The trapped ants, being an analogy of people during COVID lockdown, were interlinked by a common fate. They have no control over their circumstances, yet are able to sing a song under their united efforts.</p>
<p class="ls-p" style="margin: 0; font-family: 'Bodoni Moda', serif; font-size: 32px; font-weight: 400; line-height: 38.4px; letter-spacing: -0.96px; color: #000000">As they move across the copper conductive tape, their movements trigger notes in the C minor scale. This choice of scale is a deliberate nod to Beethoven's Symphony No. 5 in C minor, often referred to as the 'Fate Symphony'.</p>
<p class="ls-p" style="margin: 0; font-family: 'Bodoni Moda', serif; font-size: 32px; font-weight: 400; line-height: 38.4px; letter-spacing: -0.96px; color: #000000">The installation uses a transparent acrylic construction, meant to expose the inner workings of the system.</p>
<p class="ls-p" style="margin: 0; font-family: 'Bodoni Moda', serif; font-size: 32px; font-weight: 400; line-height: 38.4px; letter-spacing: -0.96px; color: #000000">The interior of the box inhabited by ants, was covered in a labyrinthine made out of conductive copper tape.</p>
<p class="ls-p" style="margin: 0; font-family: 'Bodoni Moda', serif; font-size: 32px; font-weight: 400; line-height: 38.4px; letter-spacing: -0.96px; color: #000000">This tape is wired to a Bare Conductive Touch board housed in the box beneath, with its output linked to a speaker. Each time an ant makes contact with the tape, it activates the microcontroller, which plays a musical tone.</p>
<p class="ls-p" style="margin: 0; font-family: 'Bodoni Moda', serif; font-size: 32px; font-weight: 400; line-height: 38.4px; letter-spacing: -0.96px; color: #000000">As clusters of ants navigate this labyrinth, their movements orchestrate a sequence of piano sounds. This turns their random scurrying into an unexpected musical performance, with each step triggering a note, creating a symphony that mirrors their collective journey within the confines of the box.</p>
</div>
<img src="assets/ab-bottom.jpg" alt="The lower box: the Bare Conductive Touch Board and its white and green wires under the ant chamber" style="display: block; width: 100%; max-width: 1000px; height: auto; aspect-ratio: 1000 / 560; object-fit: cover; border-radius: 34px">
<img src="assets/ab-right.jpg" alt="Ant Box from the right, wired to the speaker" style="display: block; width: 100%; max-width: 1000px; height: auto; aspect-ratio: 1000 / 560; object-fit: cover; border-radius: 34px">

<p class="ls-title pd-pop" style="margin: 0; text-align: center; font-size: 56px; font-weight: 700; line-height: 56px; letter-spacing: -2.8px; color: #000000">Pyro-Dino I</p>
<img src="assets/pd-room.jpg" alt="Pyro-Dino I: dozens of clear pod forms with LEDs hang from a wire net in a blue-lit room" style="display: block; width: 100%; max-width: 1000px; height: auto; aspect-ratio: 1000 / 560; object-fit: cover; border-radius: 34px">

<div class="pd-poem-host" tabindex="0" aria-label="Hover to read the poem" style="position: relative; width: 100%; max-width: 800px; outline: none"><div style="width: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 28px"><img src="assets/pd-por1.jpg" alt="Pods hanging in blue light, LEDs glowing inside the middle pod" style="display: block; width: 100%; height: auto; aspect-ratio: 373 / 560; object-fit: cover; border-radius: 34px"><img src="assets/pd-por2.jpg" alt="A single pod lit from within by a short strip of LEDs" style="display: block; width: 100%; height: auto; aspect-ratio: 373 / 560; object-fit: cover; border-radius: 34px"></div><div class="pd-poem" role="note"><div class="pd-poem-inner"><p style="margin: 0 0 20px">It is the ebb and flow of an oceanic feeling, a childhood dream revived,<br>A symphony played on the winds of change, whispering in the rustle of leaves.<br>It dances in the dappling sunlight through ancient trees,<br>Patterns of light that tell tales of time unspent,<br>A quiet place where one can exhale the refreshing air.</p><p style="margin: 0 0 20px">The cold, swirling wind that races into my lungs,<br>The scent of wooden smoke, ash curling into my nostril,<br>Nature is the resilience of the mountain,<br>Stoic, cloaked in the mist of early dawn,<br>The mystery of deep forests, where shadows hold secrets<br>Of beasts and blooms unseen.</p><p style="margin: 0 0 20px">A glacial river flowing into my veins,<br>Cherry blossoms, pink and hidden, in the city’s corners,<br>Nature is the relentless wave kissing the shoreline,<br>An eternal lover, tender yet powerful,<br>A wine-red sunset glazed atop the skyscraper’s crown,<br>Its vast silence in the desert, where solitude speaks louder than thunder.</p><p style="margin: 0 0 20px">It sings in the rainfall, a melody pure and cleansing,<br>Nourishing the parched earth, awakening the dormant seeds,<br>The burst of life in spring, a colorful canvas painted afresh,<br>Flowers erupting in celebration, a carnival of blooms,<br>The gentlest touch of the butterfly's wing,<br>Causing the air itself to ponder the fragility of life.</p><p style="margin: 0 0 20px">The fierce roar of the river in flood,<br>Carving paths, shaping destinies with liquid force,<br>It is the calm of spring, the heat of summer,<br>The chill of fall, the freeze of winter,<br>Scenes of nostalgia.</p><p style="margin: 0 0 20px">In every corner of the earth,<br>In every droplet of the sea,<br>In every grain of sand,<br>Nature lives, breathes, and speaks its silent language,<br>An invitation always open,<br>Calling us back to the roots of our existence</p></div></div></div>
