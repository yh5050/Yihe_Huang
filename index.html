<div class="na-host" tabindex="0" aria-label="Artist Statement: hover or tap to read" style="position: absolute; left: calc(654 / 1400 * 100cqw); top: calc(671 / 1400 * 100cqw); width: calc(717 / 1400 * 100cqw); z-index: 10; outline: none">
<h1 class="na-h1" style="margin: 0; font-family: 'Bodoni Moda', serif; font-size: calc(96 / 1400 * 100cqw); font-weight: 400; line-height: 1.2; text-align: center; color: #ffffff; cursor: default">Artist Statement</h1>
<div class="na-ov" role="note"><div class="na-ov-in"><p class="na-poem">I want to tell you about the life cycle of a seed.<br>I want to tell you how a flower slowly fades and falls.<br>I want to feel, with you, the salty sea breeze brushing through our hair.<br>I want to feel, with you, the sharp touch of silvergrass grazing across our fingertips.<br>Yet I do not know how many moments and memories like these remain for us.<br>I want to preserve my obsession with memory,<br>my devotion to every fragment of remembrance,<br>sealed away within those archives.<br>Until we both find redemption at the next turning point of a technological age.<br>Until our cells dissolve into particles,<br>vanishing into an endless expanse of code,<br>and there, at last, melt into one another.</p><h3 class="na-h">1. On Technological Advancements, Civilization and Ethics</h3><blockquote class="na-q">“I can imagine that the oceanic feeling could become connected with religion later on. That feeling of oneness with the universe which is its ideational content sounds very like a first attempt at the consolations of religion, like another way taken by the ego of denying the dangers it sees threatening it in the external world.”<br>―Sigmund Freud, <em>Civilization and Its Discontents</em></blockquote><p class="na-p">The feeling of being oceanic serves as a metaphor for love, embodying a sense of religious wonder. In ‘Civilization and Its Discontents,’ Freud posits that love acts as a unifying force in society, while civilization - the act of being civilized, imposes constraints to curb humanity’s primal desires.</p><p class="na-p">Nuclear power, computers, internet, virtual reality, artificial intelligence. As technology rapid advances, human individuals are given unprecedented strengths to shape the world around us. Without love, moral and ethical constraints, us human could impose great danger on ourselves and the world around us, whether physical or psychological. It has never been so urgent for us to address the ethics of our practice with the utilization of technologies.</p><h3 class="na-h">2. On Technological Advancements and Human Existence</h3><blockquote class="na-q">“We need to understand that five hundred years of humanism may be coming to an end, as humanism transforms itself into something that we must helplessly call post-humanism.“ (Hassan, 1977, p. 843).</blockquote><p class="na-p">The temporal nature of our existence, means that our physical bodies will eventually vanish, leaving nothing but memories of us. As our physical body turn into ashes and reunite with the natural elements, our consciousness will fade into oblivion. Yet, artifacts created by us will outlives us, carrying the depth of our humanities beyond us.</p><p class="na-p">Manmade objects carries the significance of human self-preservation. They are our non-biological off-spring. Technological artifacts of our age are no different - digital imprints, data and images, are records able to preserve our ‘self’, better than any other known medium in the entire human history.</p><p class="na-p">Yet, as technology advances, synthesized and generated information are starting to become indistinguishable from recorded data. As AI and AR/VR reshape the realities of mankind, our specie is under the great danger of the inability to prove our true existence to future generations, after our demise.</p><h3 class="na-h">3. On Nature and Post-humanism</h3><p class="na-p">In stark contrast to humanism, post-humanism states that humans are no longer the center of the natural world. Post-humanism challenges anthropocentric perspectives, advocating for a more holistic and integrated view on humanity’s place within the broader ecological and biological contexts. It encourages us to see human beings as part of the natural world - plants, other animals, or ecosystems, instead of being separate from, or superior to them.</p><p class="na-p">Post-humanism frequently explores the implications of technology on nature and human life. Some discussion are in the realms of biotechnology, genetic engineering, and artificial intelligence, all of which are fields of studies questioning the boundaries between the natural and the artificial. Post-humanist discourse often questions what counts as “natural”, in a world where technological intervention is pervasive.</p><h3 class="na-h">4. Statement</h3><p class="na-p">We should stay mindful on the risks of neglecting natural environments over technological advances. We long for the abundance of resources, as it is pivotal for our survival; yet without constraining our primal desires, we are putting the environment that we rely on at risks. The effect of unrestrained exploitations, manifest in the form of severe oceanic pollution, mountains of plastic waste, depleting natural resources, climate change, extinguished animals, and many other forms. If not regulated, we will eventually pay for our greed and the consequences of our short-sighted actions.</p><p class="na-p">In Chinese Taoist philosophy, man is to follow the guidance of nature, not to conquer nature. For that reason, the man-made and the natural were once not a set of binary opposition in the traditional Chinese cultural context. This begs the question: is it possible to perceive a world where the natural and the man-made count as equals?</p><p class="na-p">Being an artist who grew up with a profound love for nature, my childhood memories were filled with the natural world. I remember observing the shape of flowers, seeing how the wind freely animates the leaves, and smelling the warm, damp scent of the sea. These are moments I think of fondly, which have great significance in shaping my artistic identity. To me, nature represents the ultimate expression of freedom – a freedom I pursue relentlessly in life and through art. This love for nature is not just an appreciation of its beauty, but a deep connection to the natural world around me, reflecting my journey towards personal and artistic liberation.</p><p class="na-p">To conclude, we live in an era that balances on the cusp of technological dominance and a steadfast love for our natural world. As an artist, I want to address this time of change, by discussing the aforementioned topics through my work, (artifacts of existence, ethics in technology, and post-humanism), all while interweaving my passion and love for nature into my project.</p></div></div></div>
</div></div>

<h6 style="margin: 0; font-size: 26px; font-weight: 400; line-height: 42.9px; letter-spacing: -0.26px; color: #666666">From a passive communication log to an actionable workflow that guides teachers to the next step.</h6>

<div style="flex: 999 1 420px; min-width: 0; text-align: justify"><p style="margin: 0; font-size: 24px; line-height: 28.8px; color: #000000">Timeline: separating what's live from what's history</p><p style="margin: 0; font-size: 24px; line-height: 28.8px; color: #666666">A real information-architecture decision, not a visual pass. Details and Timeline became two distinct tabs so current status never gets buried under old entries.</p></div>

<div style="flex: 999 1 420px; min-width: 0; text-align: justify"><p style="margin: 0; font-size: 24px; line-height: 28.8px; color: #000000">The automated follow-up toggle: the one feature that directly answers the HMW.</p><p style="margin: 0; font-size: 24px; line-height: 28.8px; color: #666666">Automating reminders reduces the number of manual follow-up attempts a teacher makes per unresponsive parent, giving back the time the 35% stat surfaced in research.</p></div>

  { type: 'work', t: 0.142, cat: 'uxr', title: 'School Sphere Mobile', color: 'rgb(232, 237, 250)', kicker: 'UX R&D', meta: 'Published', body: 'A mobile platform research case study on fragmented K–12 communication, administrative workflows, and decision-ready product opportunities.', tags: 'User interviews · Competitive analysis · Persona synthesis · Journey mapping',
    detail: { layout: 'ssm', eyebrow: 'School Sphere · Mobile · iOS version', title: 'One dashboard for attendance, cases, and teacher support, replacing five disconnected tools',
      cover: { src: 'assets/ss-cover.jpg', alt: 'School Sphere iOS app screens: welcome and log-in, App Store listing, case pages and team status for a student case' },
      lede: 'School Sphere is a mobile platform that streamlines communication and administrative workflows across K–12 schools. The platform improves operational efficiency by unifying communication and administrative workflows for teachers and administrators.',
      facts: [{ k: 'Scope', v: '0 → 1 product' }, { k: 'Duration', v: '90 days' }, { k: 'Role', v: 'UX research, UX/UI design' }],
      sections: [
        { label: 'Problem', h: 'Administrative overhead crowds out teaching', ps: ['Teachers face significant administrative overhead from managing communication, reporting, scheduling, and student records across multiple disconnected systems, reducing time available for teaching and student support.', 'Administrative tasks are fragmented across multiple platforms, creating inefficiencies that limit educators’ ability to focus on student engagement and career development.'] },
        { label: 'Solution', h: 'One place for communication, reporting, scheduling, and records', ps: ['Created a unified platform for teachers and administrators to manage communication, reporting, scheduling, and student records in one place, reducing administrative overhead and improving operational efficiency.'] },
        { label: 'Process', h: 'Discover → Define → Ideate → Prototype → Test → Implement', items: ['01 · Discover: survey, user interview, competitive analysis.', '02 · Define: feature prioritization, user persona.', '03 · Ideate: user flows, sketches.', '04 · Prototype: wireframes, lo-fi prototype.', '05 · Test: usability test.', '06 · Implement: design system, hi-fi prototype.'],
          media: [{ src: 'assets/ss-process-white.jpg', alt: 'Six-step design process: Discover, Define, Ideate, Prototype, Test, Implement' }], cols: 'narrow' },
        { label: 'Discovery', h: 'Key questions', ps: ['Research focused on understanding administrative workflows within K–12 schools and identifying inefficiencies in existing communication systems.'], items: ['How do educators manage communication and administrative tasks today?', 'Where do existing systems create inefficiencies?', 'Which workflows consume the most time?', 'What features are essential in a centralized school management platform?'] },
        { label: 'User interviews', h: '10+ one-on-one interviews with teachers and administrators', ps: ['Conducted to understand their daily workflows, communication challenges, and administrative responsibilities.'],
          quotes: [{ who: 'Julia · 43 · Administrator', q: 'Administrative tasks are extremely frustrating because I have to use multiple different forms to submit work, which is really no point of doing redundant work.' }, { who: 'Micheal · 32 · Teacher', q: 'Reaches out to parents are absences or tardies every morning.' }, { who: 'Kim · 28 · Teacher', q: 'People will literally give us incorrect phone numbers and then make it our problem.' }] },
        { label: 'Personas', h: 'Principal X and Ms. Lee', ps: ['Principal X, a high school administrator, is trying to find a more coherent way to communicate with teachers. Ms. Lee, a math teacher, was recently assigned an intervention class primarily attended by students on IEP/504 plans, increasing her administrative workload.'],
          media: [{ src: 'assets/ss-persona-admin.jpg', alt: 'Persona: Principal X, 47, high school administrator in New York City. Core needs, frustrations, platforms and tools.' }, { src: 'assets/ss-persona-teacher-eq.jpg', alt: 'Persona: Ms. Lee, 30, high school math teacher in New York City. Core needs, frustrations, platforms and tools.' }], cols: 'two' },
        { label: 'Key takeaways', h: 'Where teacher administrative time goes', items: ['Communication is fragmented across multiple platforms.', 'Administrative tasks consume significant educator time: family communication alone takes 35%.', 'Student information and operational tools are not centralized.', 'Frequent context switching reduces workflow efficiency.'],
          media: [{ src: 'assets/ss-admin-work.jpg', alt: 'Teacher administrative work: family communication 35%, MTSS/RTI process 20%, IEP/504 paperwork 20%, attendance monitoring 15%, teacher communication 10%' }], cols: 'narrow' },
        { label: 'User site map', h: 'Site map for teachers', ps: ['Dashboard, cases, case page, new log entry, and the quick-action attendance flow, and how they connect.'],
          media: [{ src: 'assets/ss-sitemap.jpg', alt: 'Teacher site map: dashboard, cases, case page, new log entry, quick actions and attendance flow' }], cols: 'one' },
        { label: 'User flow', h: 'Office hours, profile, and notifications', ps: ['From start to exit: reviewing booked office hours, requesting time changes, following up on missed meetings, setting work mode, and answering messages.'],
          media: [{ src: 'assets/ss-userflow.jpg', alt: 'User flow diagram covering office hours, profile and work mode, and notifications' }], cols: 'one' },
        { label: 'User journey', h: 'From burnout to retention', ps: ['A teacher’s journey from problem awareness and consideration through onboarding, initial and continued use, challenges, and retention: what they think, feel, and do at each stage.'],
          media: [{ src: 'assets/ss-journey.jpg', alt: 'User journey map across eight stages with thinking, feeling and doing for each' }], cols: 'one' },
        { label: 'Prototype', h: 'From a passive communication log to an actionable workflow', ps: ['A prototype that guides teachers to the next step. Competitive analysis assessed industry-leading solutions to understand current market offerings, workflow limitations, and opportunities for operational improvement.'],
          media: [{ video: true, src: 'assets/ss-workflow-1.mp4', alt: 'Prototype walkthrough, workflow 1' }, { video: true, src: 'assets/ss-workflow-2.mp4', alt: 'Prototype walkthrough, workflow 2' }, { video: true, src: 'assets/ss-workflow-3.mp4', alt: 'Prototype walkthrough, workflow 3' }], cols: 'three' },
        { label: 'Define', h: 'Design decisions', items: ['Case status: making “action required” impossible to miss. The first pass tracked cases with plain checkmarks, with no signal for what still needed a teacher’s attention.', 'Timeline: separating what’s live from what’s history. Details and Timeline became two distinct tabs so current status never gets buried under old entries.', 'The automated follow-up toggle: automating reminders reduces the number of manual follow-up attempts a teacher makes per unresponsive parent, giving back the time the 35% stat surfaced in research.'] },
        { label: 'Strategy', h: 'Two principles guided every design decision', items: ['01 · Surface status, not just history. A log of what happened is less useful than a clear read on what needs to happen next.', '02 · Automate the nudge, not the relationship. The system should chase silence so the teacher doesn’t have to, leaving the human conversation to them.'] }
      ] } },

  { type: 'work', t: 0.206, cat: 'uxr', title: 'Time Map', kicker: 'UX R&D', meta: 'Published', body: 'A spatial social platform for communicating across people, place, and time.', tags: 'Concept research · Information architecture · Interaction mapping',
    detail: { layout: 'tm', eyebrow: 'Time Map · Spatial social platform', title: 'A spatial social platform for communicating across people, place, and time',
      lede: 'Digital communication is built for the present moment. Time Map asks what happens if you design for a different one, on purpose.',
      facts: [{ k: 'Scope', v: '0 → 1 product' }, { k: 'Duration', v: '60 days' }, { k: 'Role', v: 'UX research, UX/UI design' }],
      sections: [
        { label: 'Overview', h: 'What if memories could be discovered instead of just stored?', ps: ['Time Map is a spatial communication platform that lets people create memory capsules tied to a specific place and point in time. By combining an interactive map with a draggable timeline, users can intentionally rediscover past experiences or access messages scheduled for the future.', 'My responsibilities: end-to-end problem framing, user research, competitive positioning, product strategy, information architecture, interaction design, and a high-fidelity clickable prototype.', 'Outcome: a working prototype covering the full loop (discover, create, open, connect), built around one core interaction: a bidirectional map + timeline.'] },
        { label: 'Problem', h: 'Optimized for immediacy, not meaning that unfolds over time', items: ['Products optimize for now. Messages are meant to be read immediately. Stories expire. Feeds rank recency over relevance, leaving no place for content tied to a specific past or future moment.', 'Memories are archived, not experienced. Photo libraries resurface content algorithmically, on the platform’s schedule, not the user’s.', 'Place is metadata, not interaction. Location is a tag on a post, not a way to navigate. No product asks: what happened here, at a different time?'] },
        { label: 'Design challenge', h: 'How do you make time and place things people can deliberately navigate?', items: ['A first-time user creates and places a capsule with no instruction.', 'A user finds something meaningful near their location within seconds.', 'People schedule content for the future, not just the present.'] },
        { label: 'Research', h: 'Is “time travel” a real motivating frame, or just an appealing metaphor?', ps: ['Method: semi-structured 1:1 interviews, the right method for unprompted emotional recall (“what would you time travel to, and why?”).', 'Sample and rigor, stated plainly: two interviews are shown as illustrative primary research, directional, not saturated. A production study would extend to 8–12 participants before treating any decision as validated.', 'Where the bias is: both quotes skew toward past-nostalgia over future-self framing, which could quietly bias the product toward “revisit” over “send forward” if left unchecked.'] },
        { label: 'Product opportunity', h: 'People, place, and time as one interaction model', ps: ['Time Map has no direct competitors. Instead, it competes with behavioral alternatives (Instagram, Apple / Google Photos, FutureMe, BeReal, Snapchat Memories, Timehop, Geocaching), each addressing only one part of the underlying need.', 'No existing product spans all three dimensions across all three time horizons. This isn’t “time travel” as a gimmick. It’s intentional memory: giving people control over when and where something gets rediscovered.'] },
        { label: 'From insight to decision', h: 'Each insight maps to one testable decision', items: ['People remember places as strongly as time → location becomes a primary interaction, not metadata.', 'Delayed communication carries emotional weight → “when to open” is a mandatory, first-class step.', 'Public sharing requires clear privacy boundaries → three privacy tiers (Personal / Friends / Public), presented as a required step.', 'People think about memories chronologically, not by exact date → a draggable timeline replaces a conventional date picker.'] },
        { label: 'Product strategy', h: 'Leave something for a place and a time, not just a person', ps: ['Core interaction model: People + Place + Time → Memory Capsule → Discovery → Connection.', 'North Star metric: capsules opened per active user per week, rewarding the full loop (leave, discover, open) rather than one-sided posting or passive scrolling.', 'MVP scope: map + timeline browsing, capsule creation (media, schedule, privacy), capsule opening (map + AR), and a minimal social layer. 3D-scan capsules and public discovery algorithms are deliberately out of scope for v1.'] },
        { label: 'Final solution', h: 'Five flows around the bidirectional map + timeline', items: ['01 · Discover through time. A draggable timeline paired with a live map lets users scrub between past and future years while staying anchored to one place.', '02 · Create a capsule. Choosing the medium (image, video, audio, music, or text) is its own step, because each is a different sensory way to share a memory.', '03 · Edit capsule. First when to open (a required date), then who sees it (privacy tier plus friend sharing), each its own decision.', '04 · Open a capsule. Media first, authorship and date second, social layer last, mirroring how memory itself is processed.', '05 · Connect with others. A shared capsule is a lower-friction entry point into contact than a direct message.'] }
      ] } },

  { type: 'work', t: 0.238, cat: 'uxr', title: 'Interactive Nature Map', color: '#5A926D', kicker: 'Creative Technology', meta: 'Furnished work', body: 'A field of wind-blown grass hiding a New York neighborhood, traced onto the viewer’s hand.', tags: 'Prototype research · Interaction experiments · Systems thinking',
    detail: { layout: 'inm', eyebrow: 'Creative technology · Live p5 sketch', title: 'Interactive Systems Lab',
      lede: 'This piece begins with a longing for land, the pull toward a place that isn’t just geography but memory.',
      facts: [{ k: 'Medium', v: 'p5.js, Perlin noise, hand tracking' }, { k: 'Context', v: 'System story' }, { k: 'Method', v: 'Prototype probe' }],
      sections: [
        { label: 'Project direction', h: 'Nature and city, memory and place, drawn from the same root', ps: ['At its center is a field of wind-blown grass, color and thickness and length shifting over time as though the field itself were breathing, alive with the same restlessness as memory. Hidden inside that movement is the outline of a specific New York City neighborhood, its streets and blocks quietly shaping how the grass grows.', 'The lines that move through the grass aren’t just wind, they’re memory made visible. When a viewer’s hand enters the frame, a filter finds the fingers and traces those same lines across the skin, city becoming skin, skin becoming map. To look at the grass is to become part of what it remembers.'] },
        { label: '03 · Reflection', h: 'Human response', ps: ['The interactive filter in action: a hand enters the frame, and the same lines that move through the grass are traced across the fingers.'] },
        { label: '02 · Method', h: 'How to achieve it', items: ['Dynamic wind-blown grass: Perlin noise drives natural, non-repeating motion; color, thickness, and length evolve continuously rather than looping.', 'Map integration: the chosen NYC area becomes geographic data (street lines, block shapes) that steers how grass is distributed and grown.', 'Hand tracking and interaction: a hand-tracking library detects a hand and projects the map lines onto the fingers in real time.', 'Animation and rendering: each blade’s state updates every frame inside draw(), so the field reads as one continuous motion.', 'Interaction handling: the grass responds to hand presence with subtle shifts in color or motion, so the piece feels responsive rather than scripted.'] },
        { label: 'First sketch', h: '200 generative lines', ps: ['A first pass in p5.js: 200 generative lines, each seeded from a random point. Every frame, each line extends slightly along an angle drawn from Perlin noise: a small, simple rule that produces something that reads as wind. It’s the seed the rest of the piece grows from.'] }
      ] } },

  { type: 'work', t: 0.27, cat: 'uxr', title: 'Skull Slot Machine', color: '#000000', kicker: 'Creative Technology', meta: 'Furnished work', body: 'A Halloween slot machine housed in a 3D-printed skull: press the button, watch the eyes spin, win candy.', tags: 'Arduino IDE · Blender · Cura · Arduino Nano · Stepper motors · Servo',
    detail: { layout: 'skull', eyebrow: 'Creative technology', title: 'Skull Slot Machine',
      lede: 'A Halloween slot machine housed in a 3D-printed skull: press the button, watch the eyes spin, win candy.',
      facts: [{ k: 'Disciplines', v: 'Interaction design, physical computing, mechanical engineering' }, { k: 'Tools', v: 'Arduino IDE, Blender, Ultimaker Cura' }, { k: 'Hardware', v: 'Arduino Nano, stepper motors, servo, 3D-printed housing' }],
      sections: [
        { label: 'Project overview', h: 'Randomness and probability as a physical, rewarding moment', ps: ['Skull Slot Machine reimagines the classic slot machine as a tactile, Halloween-themed installation. Press a button and the skull’s eyes spin like slot reels through four symbols each; align both and the mouth opens to dispense candy.', 'The project sits at the intersection of mechanical design, embedded programming, and playful interaction.'] },
        { label: 'My role', h: 'Technical development, end to end', items: ['Designed the Arduino control logic governing the full interaction sequence.', 'Programmed stepper motor behavior for randomized, independent eye rotation.', 'Developed the symbol-matching algorithm that determines win conditions.', 'Integrated servo control to trigger mouth-opening and candy release.', 'Handled wiring, testing, and debugging across the full electromechanical system.'], ps: ['Core contribution: converting rule-based logic (randomness, probability, matching) into precise physical motion through code.'] },
        { label: 'System design', h: 'Unpredictable, but legible and satisfying', items: ['Two stepper motors independently rotate the eyes in ¼-revolution increments, up to 2 full revolutions: 8 discrete symbol positions per eye.', 'A random value per motor is mapped to a symbol position via modulus-based logic; the remainder sets the final resting symbol.', 'Matching symbols on both eyes trigger a servo motor to open the mouth.', 'The mouth holds open 2 seconds to dispense candy, then closes automatically.'] },
        { label: 'Reflection', h: 'Code that shapes a moment', ps: ['This project sharpened my ability to bridge software logic and physical systems by translating computational randomness into tangible motion, and coordinating multiple motors with tight timing precision.', 'It deepened my interest in physical computing as a storytelling medium, where code doesn’t just run in the background, but directly shapes how someone moves through and experiences a moment.'] }
      ] } },

  { type: 'work', t: 0.415, cat: 'art', title: 'Light and Shadow', color: '#3B3B3B', kicker: 'Sculpture studies · fired clay', meta: '2021', body: 'Light, reflection, and spatial perception, after Plato’s Allegory of the Cave.', tags: '',
    detail: { layout: 'ls', eyebrow: 'Light and Shadows (I, II and III) · Sculpture studies, fired clay', title: 'Light and Shadow',
      lede: 'Shadows and Light explores the relationship between perception, reality, and identity through sculpture, light, and motion.',
      quote: { q: 'The prisoners see only the shadows cast by these statues and other objects; and having lived in the cave from childhood, they no longer recall any other reality. They do not suspect that these shadows are but imperfect images of objects that they cannot see; and consequently they mistake the shadows for the real.', who: 'Plato, Allegory of the Cave' },
      facts: [{ k: 'Year', v: '2021' }, { k: 'Medium', v: 'Plaster forms, light, rotating platform' }],
      sections: [
        { label: 'Overview', h: 'Reality in the object, or in the perception it creates?', ps: ['Inspired by Plato’s Allegory of the Cave, the work questions how people construct reality from incomplete information and how perception shapes our understanding of ourselves and the world.', 'Rather than treating sculpture as a static object, the installation uses light, shadow, and rotation as equally important materials. As the sculpture slowly turns, fragmented forms align to produce a complete human silhouette through shadow, revealing an image that exists only temporarily.'] },
        { label: 'Concept', h: 'Between the tangible self and the image we project', ps: ['My artistic practice often investigates philosophical questions surrounding existence, memory, identity, and human perception. During this period, my work shifted from formal explorations of geometry and found objects toward more personal questions about cultural identity and selfhood.', 'By transforming fragmented objects into a coherent shadow portrait, the work suggests that our understanding of reality is often assembled from incomplete perspectives.'] },
        { label: 'Process', h: 'Four plaster forms on a rotating platform', ps: ['Individually, each form appears abstract and disconnected. Only through the interaction of movement and light do the pieces combine into a recognizable human profile.', 'Rotation introduces time as a material, allowing the sculpture to continually shift between abstraction and representation. The shadow becomes a temporary image that exists only through the relationship between object, light, and viewer.'] }
      ] } },

  { type: 'work', t: 0.445, cat: 'art', title: 'Yellow Box', kicker: 'Landscape installation · plastic bags', meta: '2019', body: 'A 65-foot box of yellow-dyed plastic bags in an untouched landscape: a warning about a plastic invasion of the natural world.', tags: '',
    detail: { layout: 'yb', eyebrow: 'Landscape installation · plastic bags', title: 'Yellow Box',
      lede: 'In the midst of a sprawling, untouched landscape, a box stands out as a striking anomaly, evoking the iconic monolith from “2001: A Space Odyssey”.',
      facts: [{ k: 'Scale', v: '10 ft high · 10 ft wide · 65 ft long' }, { k: 'Material', v: 'Thousands of dyed plastic bags on a wooden frame' }, { k: 'Exhibited', v: 'Vivid Cube' }],
      sections: [
        { label: 'Concept', h: 'The onset of a plastic invasion', ps: ['This incongruity in the natural setting is stark: a man-made object in a place seemingly untouched by modernity. As we gaze from afar, the box’s plastic material takes on a deceiving texture, almost resembling wool, blurring the lines between the artificial and the natural.', 'Yellow Box stands as a warning against a dystopian future. This work symbolizes the early stages of an environmental crisis, where synthetic materials begin to disrupt the harmony of natural landscapes.'] },
        { label: 'Scale', h: 'Designed to evoke a sense of terror up close', ps: ['The box’s imposing dimensions are intentionally chosen for impact. Its sheer scale and volume highlight the overwhelming and intrusive nature of plastic pollution in our environment.'] },
        { label: 'Making', h: 'Thousands of bags, dyed a vivid yellow', ps: ['To create this piece, I gathered thousands of used plastic bags, dyeing each one a vivid yellow. The color ensures the installation stands out against its surroundings, and yellow is often associated with caution, underlining a sense of warning and urgency.', 'Beneath this bright, artificial skin lies a wooden frame, symbolizing the intrusion of man-made materials into natural environments. The box itself critiques humanity’s neglectful impact on the delicate balance of our ecosystem.'] }
      ] } },

  { type: 'work', t: 0.475, cat: 'art', title: 'Ant Box', color: '#471E16', kicker: 'Performance installation · ants', meta: '2022', body: 'A bio-art installation made during COVID lockdown: trapped ants trigger notes in C minor as they cross a copper labyrinth.', tags: '',
    detail: { layout: 'ab', eyebrow: 'Performance installation · ants · Bare Conductive Touch Board', title: 'Ant Box',
      lede: 'Ant Box is a bio-art installation I created during the ongoing COVID lockdown.',
      facts: [{ k: 'Year', v: '2022' }, { k: 'Hardware', v: 'Bare Conductive Touch Board, copper tape, speaker' }, { k: 'Exhibited', v: 'CultureHub Re–Fest 2023' }],
      sections: [
        { label: 'Concept', h: 'A song under united effort', ps: ['The trapped ants, an analogy for people during COVID lockdown, were interlinked by a common fate. They have no control over their circumstances, yet are able to sing a song under their united efforts.', 'As they move across the copper conductive tape, their movements trigger notes in the C minor scale, a deliberate nod to Beethoven’s Symphony No. 5 in C minor, often referred to as the “Fate Symphony”.'] },
        { label: 'System', h: 'A labyrinth that plays piano', ps: ['The installation uses a transparent acrylic construction, meant to expose the inner workings of the system. The interior of the box was covered in a labyrinth made out of conductive copper tape, wired to a Bare Conductive Touch Board housed beneath, with its output linked to a speaker.', 'Each time an ant makes contact with the tape, it activates the microcontroller, which plays a musical tone. As clusters of ants navigate this labyrinth, their random scurrying becomes an unexpected musical performance, a symphony that mirrors their collective journey within the confines of the box.'] }

      sky.position.copy(camPos);

      coreProj.copy(origin).project(camera);
      var behind = coreProj.z > 1 || !isFinite(coreProj.x) || !isFinite(coreProj.y) || camPos.lengthSq() < 4;
      brightMat.uniforms.uCore.value.set(behind ? -5 : coreProj.x * 0.5 + 0.5, behind ? -5 : coreProj.y * 0.5 + 0.5);

    }

  }
